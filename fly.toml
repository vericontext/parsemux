# fly.toml app configuration file generated for parsemux-api on 2026-04-02T15:30:34+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'parsemux-api'
primary_region = 'nrt'

[build]

[env]
  PARSEMUX_HOST = '0.0.0.0'
  PARSEMUX_PORT = '8000'
  PARSEMUX_MODE = 'demo'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
