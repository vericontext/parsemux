[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parsemux"
version = "0.1.0"
description = "Document parser orchestrator — auto-routes to the optimal OSS parser for each document"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Vericontext" }]
keywords = ["pdf", "document", "parser", "ocr", "rag", "mcp", "vlm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: General",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-magic>=0.4",
]

[project.urls]
Homepage = "https://parsemux.com"
Repository = "https://github.com/vericontext/parsemux"
Issues = "https://github.com/vericontext/parsemux/issues"

[project.optional-dependencies]
pymupdf = ["pymupdf4llm>=1.0"]
kreuzberg = ["kreuzberg>=3.0"]
docling = ["docling>=2.0"]
mineru = ["mineru>=2.0"]
marker = ["marker-pdf>=1.0"]
all = ["parsemux[pymupdf,kreuzberg,docling,mineru,marker]"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
ui = ["gradio>=5.0"]
mcp = ["mcp>=1.0"]
serve = ["parsemux[api,ui]"]
cli = ["typer>=0.12"]
vlm = ["httpx>=0.27", "pyyaml>=6.0"]
dev = ["pytest", "pytest-asyncio", "ruff"]
full = ["parsemux[all,serve,cli,mcp,vlm]"]

[project.scripts]
parsemux = "parsemux.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/parsemux"]
artifacts = ["src/parsemux/core/vlm_models.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
